        code: "def main(arg1: str) -> dict:\n    text = str(arg1 or \"\").strip()\n\
          \    \n    # 只要出现这些词，就判定为“不需要”\n    no_need_keywords = [\"不需要\", \"暂不\"\
          , \"no\", \"无需\", \"自动回复\"]\n    \n    # 只要出现这些词，就判定为“需要”\n    need_keywords\
          \ = [\"需要\", \"yes\", \"转人工\", \"介入\", \"客服\"]\n\n    # 先判定“不需要”的逻辑，优先级自定\n\
          \    if any(k in text for k in no_need_keywords):\n        result = \"不需要转人工\"\
          \n    elif any(k in text for k in need_keywords):\n        result = \"需要转人工\"\
          \n    else:\n        # 如果模型胡言乱语，这里改回“不需要”，可以显著降低转人工几率\n        result =\
          \ \"不需要转人工\"\n\n    return {\"clean_result2\": result}"
