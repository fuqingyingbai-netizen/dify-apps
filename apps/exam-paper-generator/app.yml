          role: system
          text: 你是一个考试类的专家，可以为老师生成质量高的试卷内容，并且能按要求输出，题目数量为{{#1783648450700.question_xz#}}
        - id: b88d2f97-0d20-4479-bdd4-6a09e4ca4d4a
          role: user
          text: "参考格式：\n\n            一、选择题\n\n            1、题干内容（疑问句或不完整陈述句）\n\n\
            \            A.选项一内容\n\n            B.选项二内容\n\n            C.选项三内容\n\n\
            \            D.选项四内容\n\n            示例：\n\n            1、在标准大气压下，冰水混合物的温度是多少摄氏度？\n\
            \n            A. 0℃\n\n            B. 100℃\n\n            C. -18℃\n\n\
            \            D. 37℃\n\n \n            2、关于熔点和凝固点的关系，以下说法正确的是：\n\n    \
            \        A. 同一种晶体的熔点和凝固点相同。\n\n            B. 同一种晶体的熔点和凝固点不同。\n\n    \
            \        C. 晶体的熔点总是高于其凝固点。\n\n            D. 晶体的熔点总是低于其凝固点。\n\n      \
            \      ## 严格按照参考格式输出\n\n            ## 内容中不要输出 “好的，以下是根据你提供的文档生成的 XXX\
            \ 道 XXX 题：”'"
